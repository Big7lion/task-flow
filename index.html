<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Flow</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app" class="task-flow-module">
    <div class="preset-panel" id="preset-panel">
      <div class="preset-panel-header">
        <h3>Preset Nodes</h3>
        <button id="add-preset-btn" class="btn-add" title="Add preset node">+</button>
      </div>
      <div class="preset-list" id="preset-list"></div>
    </div>
    <div class="canvas-container" id="canvas-container"></div>
    <div class="gui-container" id="gui-container"></div>
  </div>

  <div class="modal" id="preset-modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>Add Preset Node</h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="monaco-editor"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" id="modal-cancel">Cancel</button>
        <button class="btn btn-save" id="modal-save">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
